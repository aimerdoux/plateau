version = "2.1"
[budget]
compaction_chars = 12000
startup_chars = 6000
prompt_chars = 0            # per-prompt injection off; D-037 measured ρ̂ ≈ 0.26 with it
[selector]
tau_turns = 3               # τ = tau_turns × measured receipts-per-turn; default 90 receipts
degree_cap = 3              # ln(1 + min(degree, degree_cap))
weights = { symbol = 1.4, error = 1.3, decided = 1.4, read = 1.2, test = 1.2, file = 0.7, command = 0.6, search = 0.3, tool = 0.0 }   # 0 = kind never indexed
bridge_quota = 0.40         # share of lines reserved for nodes older than the previous compaction
sticky = true               # a line injected at k is re-injected at k+1 unless its file was edited or its error resolved
lexical = true               # query-aware: last user prompt from the transcript is the query at compaction
[nodes]
read_facts = true           # signatures / config keys / file:line from Read results (regex: def|function|export|class|KEY=)
decided_facts = true        # DECISION: / FACT: marker lines lifted at Stop
[continuum]
carry = true                # at a compaction, force in the knowledge the current request descends from (0.4)
[lab]
holdout_rate = 0.10
shadow_probe_every_turns = 4
canary_share = 0.20
[compaction]
enabled = false             # 0.5: compaction as a Plateau procedure (plateau.bridge.pressure); opt in per user or project
soft_pct = 0                # inject the crystallize procedure here; 0 = hard_pct - 5
hard_pct = 0                # native compaction point; 0 = live CLAUDE_AUTOCOMPACT_PCT_OVERRIDE, else 95
window = 0                  # tokens; 0 = Claude Code's autoCompactWindow setting, else 200000
steer_summary = true        # PreCompact prints plain-text summary instructions (JSON customInstructions is ignored);
                            # the summarizer writes DECISION:/FACT:/OPEN: lines, lifted into the graph after compaction
mid_task = false            # also ask the working model to crystallize at the soft line (ignored in 3 live runs; opt in)
deliver = "context"         # mid_task delivery: "context" (additionalContext) or "block" (PostToolUse correction)
